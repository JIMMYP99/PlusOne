<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plus One">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Plus One</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{
  --bg:#000;
  --surface:#17181c;
  --surface-2:#24262c;
  --surface-3:#31343c;
  --line:#2a2d34;
  --text:#f3f0e8;
  --muted:#9c9ca5;
  --accent:#f6c915;
  --accent-ink:#151200;
  --danger:#ff5d5d;
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --font-display:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --tabbar:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 var(--font-ui);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:disabled{opacity:.35;cursor:default}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font:700 20px var(--font-display);letter-spacing:-.01em}
.mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 15px var(--font-display);letter-spacing:-.03em}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--surface);display:grid;place-items:center;font:400 24px/1 var(--font-display)}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn:active{background:var(--surface-2)}

/* content */
#view{padding:8px 16px calc(var(--tabbar) + 28px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.loading{color:var(--muted);padding:40px 0;text-align:center}
.banner{background:#3a2f00;color:#ffe58a;padding:10px 14px;border-radius:12px;font-size:14px;margin-bottom:12px}
.hint{color:var(--muted);font-size:14px;margin:4px 0 14px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabbar) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:rgba(0,0,0,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}

/* week bar and chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:6px 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 14px;border-radius:999px;background:var(--surface);font-weight:600;font-size:15px;color:var(--text)}
.chip.on{background:var(--accent);color:var(--accent-ink)}

/* exercise card */
.card{background:var(--surface);border-radius:18px;padding:16px;margin-bottom:12px;scroll-margin-top:calc(72px + env(safe-area-inset-top))}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px}
.card-head h3{margin:0;font:600 18px/1.25 var(--font-ui);flex:1;min-width:0}
.muscle{color:var(--muted);font-size:13px;white-space:nowrap}
.card.collapsed{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 16px;margin-bottom:8px;background:var(--bg);border:1px solid var(--line)}
.card.collapsed h3{margin:0;font:600 17px/1.25 var(--font-ui);color:var(--muted)}
.collapse-btn{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted);align-self:center;margin:-4px -6px -4px 0}
.collapse-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.alldone{color:var(--muted);text-align:center;padding:14px 0 6px;font-size:15px}
.last{color:var(--muted);font-size:14px;margin-bottom:12px;line-height:1.5}
.last b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.sethead{display:grid;grid-template-columns:24px 1fr 1fr;gap:8px;color:var(--muted);font-size:12px;margin-bottom:6px}
.sethead span:nth-child(n+2){text-align:center}
.set{display:grid;grid-template-columns:24px 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.set .n{color:var(--muted);font:600 14px var(--font-display);text-align:center;font-variant-numeric:tabular-nums}
.stepper{position:relative;display:flex;align-items:center;height:48px;background:var(--surface-2);border-radius:12px;overflow:hidden}
.stepper button{width:42px;height:48px;font:400 26px/1 var(--font-display);color:var(--text);flex:0 0 auto}
.stepper button:active{background:var(--surface-3)}
.stepper input{flex:1;width:0;min-width:0;height:48px;border:0;background:transparent;text-align:center;font:700 22px var(--font-display);font-variant-numeric:tabular-nums;color:var(--text);-moz-appearance:textfield;padding:0}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input::placeholder{color:var(--muted);font-weight:500;font-size:15px}
.bump{position:absolute;top:3px;right:4px;font:700 10px/1.4 var(--font-display);color:var(--accent-ink);background:var(--accent);padding:1px 5px;border-radius:999px;pointer-events:none}

.hold{margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
.hold .hl{font-size:14px;font-weight:600;line-height:1.25;margin-bottom:8px}
.hold .hs{display:block;font-size:12px;color:var(--muted);font-weight:400}
.holdrow{display:grid;grid-template-columns:24px 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.holdrow .n{color:var(--muted);font:600 14px var(--font-display);text-align:center}
.actions{display:flex;gap:10px;align-items:center;margin-top:10px}
.btn{height:50px;border-radius:999px;padding:0 22px;font:700 17px var(--font-display);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);flex:1}
.btn.primary:active{filter:brightness(.92)}
.btn.ghost{color:var(--text);background:var(--surface-2);padding:0 18px}
.btn.ghost:active{background:var(--surface-3)}
.btn.text{color:var(--accent);padding:0 8px;height:44px;font-size:15px}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%}

.x{color:var(--muted);font-weight:500;padding:0 2px}

/* empty states */
.empty{padding:28px 4px}
.empty h2{margin:0 0 6px;font:700 22px var(--font-display)}
.empty p{color:var(--muted);margin:0 0 18px}
.stack{display:flex;flex-direction:column;gap:10px}

/* exercises tab */
.section{margin:16px 0 8px;display:flex;justify-content:space-between;align-items:center}
.section h2{margin:0;font:700 17px var(--font-display)}
.grp{color:var(--muted);font-size:13px;font-weight:600;margin:14px 4px 6px}
.abs-grp{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-size:15px;color:var(--text)}
.exrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;background:var(--surface);border-radius:14px;margin-bottom:8px;width:100%;text-align:left}
.exrow:active{background:var(--surface-2)}
.exrow .nm{font-weight:600}
.exrow .sub{color:var(--muted);font-size:13px}
.exrow .chev{color:var(--muted);font-size:22px;line-height:1}


/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:22px 22px 0 0;padding:12px 20px calc(20px + env(safe-area-inset-bottom));max-height:90vh;max-height:90dvh;overflow:auto;animation:up .22s ease-out;max-width:560px;margin:0 auto}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--surface-3);margin:0 auto 14px}
.sheet h2{margin:0 0 14px;font:700 22px var(--font-display)}
.field{margin-bottom:14px;min-width:0}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input[type=text],.field input[type=number],.field select,.field textarea{width:100%;border:0;border-radius:12px;background:var(--surface-2);padding:0 14px;font-size:17px;color:var(--text);-webkit-appearance:none;appearance:none}
.field input[type=text],.field input[type=number],.field select{height:50px;font-variant-numeric:tabular-nums}
.field input[type=number]{-moz-appearance:textfield}
.field input[type=number]::-webkit-outer-spin-button,.field input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field textarea{padding:12px 14px;min-height:110px;font-size:14px;font-family:var(--font-ui);resize:vertical}
.selwrap{position:relative}
.selwrap select{padding-right:36px}
.selwrap:after{content:"";position:absolute;right:16px;top:50%;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px}
.seg button{flex:1;height:42px;border-radius:9px;font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.sheet .stepper{height:50px}
.sheet .stepper input{height:50px;font-size:20px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--accent);color:var(--accent-ink);font:700 15px var(--font-display);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark">+1</span><span>Plus One</span></div>
  <button class="iconbtn" data-act="settings" aria-label="Settings">
    <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg>
  </button>
</header>
<main id="view"><div class="loading">Loading your log</div></main>
<nav class="tabs">
  <button class="tab on" data-act="tab" data-tab="workout"><svg viewBox="0 0 24 24"><path d="M2 10v4M5 8v8M19 8v8M22 10v4M5 12h14"/></svg>Workout</button>
  <button class="tab" data-act="tab" data-tab="exercises"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Exercises</button>
</nav>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

var KEY = 'plusone:v1';
var MUSCLES = ['Chest','Back','Shoulders','Biceps','Triceps','Quads','Hamstrings','Glutes','Calves','Abs','Other'];

/* ---------- storage: Claude artifact storage if present, otherwise the device's local storage ---------- */
var store = {
  hasClaude: function(){ return !!(window.storage && typeof window.storage.get === 'function'); },
  get: function(k){
    if (this.hasClaude()) {
      try { return window.storage.get(k, false).then(function(r){ return (r && r.value != null) ? r.value : null; }, function(){ return null; }); }
      catch (e) { return Promise.resolve(null); }
    }
    try { return Promise.resolve(localStorage.getItem(k)); } catch (e) { return Promise.resolve(null); }
  },
  set: function(k, v){
    if (this.hasClaude()) {
      try { return window.storage.set(k, v, false).then(function(r){ return !!r; }, function(){ return false; }); }
      catch (e) { return Promise.resolve(false); }
    }
    try { localStorage.setItem(k, v); return Promise.resolve(true); } catch (e) { return Promise.resolve(false); }
  }
};

/* ---------- helpers ---------- */
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function round2(n){ return Math.round(n * 100) / 100; }
function fmtW(w){ w = Number(w) || 0; return w === 0 ? 'BW' : String(round2(w)); }
function setsText(sets){ return sets.map(function(s){ return fmtW(s.w) + '<span class="x">×</span>' + (Number(s.r) || 0); }).join(', '); }
var HOLD_MIN = 20, HOLD_MAX = 25;
var ABS = 'abs'; /* reserved day id: these exercises sit at the end of every training day */
function clampHold(h){ return clamp(Math.round(Number(h) || HOLD_MIN), HOLD_MIN, HOLD_MAX); }
function holdsOf(c){
  if (Array.isArray(c.holds)) return c.holds;
  var h = Number(c.hold) || 0;
  return h > 0 ? [{ w: c.holdW == null ? null : c.holdW, s: h }] : [];
}
function holdText(c){
  var hs = holdsOf(c).filter(function(h){ return (Number(h.s) || 0) > 0; });
  if (!hs.length) return '';
  var parts = hs.map(function(h){ return (h.w == null ? '' : fmtW(h.w) + '<span class="x">×</span>') + (Number(h.s) || 0) + ' s'; });
  return hs.length === 1 ? parts[0] + ' hold' : 'holds ' + parts.join(', ');
}
function currentText(c){ var h = holdText(c); return setsText(c.sets) + (h ? ', ' + h : ''); }
function clamp(n, lo, hi){ return Math.min(hi, Math.max(lo, n)); }
function pad(n){ return (n < 10 ? '0' : '') + n; }
function today(){ var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function copy(o){ return JSON.parse(JSON.stringify(o)); }

/* ---------- state ----------
   Each exercise carries one set of numbers (its "current"): the sets and hold from the last time it was done.
   Updating replaces them. Nothing older is kept. */
var S = null;
var ui = { tab: 'workout', day: 'all', saveOK: true, expanded: {} };
var drafts = {};

function defaultState(){ return { v: 2, units: 'kg', days: [], exercises: [] }; }
function exById(id){ for (var i = 0; i < S.exercises.length; i++) if (S.exercises[i].id === id) return S.exercises[i]; return null; }
function dayName(id){ for (var i = 0; i < S.days.length; i++) if (S.days[i].id === id) return S.days[i].name; return ''; }
function setWeight(ex){ return (ex.weight == null || ex.weight === '') ? null : Number(ex.weight); }
function hasCurrent(ex){ return !!(ex.current && ex.current.sets && ex.current.sets.length); }
function currentWeight(ex){
  if (hasCurrent(ex)) return ex.current.sets.reduce(function(m, x){ return Math.max(m, Number(x.w) || 0); }, 0);
  return setWeight(ex);
}

/* Older saves kept a session log; fold it down to each exercise's latest numbers. */
function migrate(st){
  st.days = st.days || []; st.exercises = st.exercises || []; st.units = st.units || 'kg';
  if (Array.isArray(st.sessions)) {
    st.exercises.forEach(function(ex){
      if (ex.current) return;
      var arr = st.sessions.filter(function(x){ return x.exId === ex.id; }).sort(function(a, b){
        if (a.date !== b.date) return a.date < b.date ? -1 : 1;
        return (a.ts || 0) - (b.ts || 0);
      });
      var last = arr[arr.length - 1];
      var overridden = last && ex.weightSetAt && ex.weightSetAt > (last.ts || 0);
      if (last && !overridden) ex.current = { sets: last.sets.map(function(x){ return { w: Number(x.w) || 0, r: Number(x.r) || 0 }; }), hold: Number(last.hold) || 0 };
    });
    delete st.sessions;
  }
  st.exercises.forEach(function(ex){
    if (!hasCurrent(ex)) { ex.current = null; }
    else if (!Array.isArray(ex.current.holds)) { ex.current.holds = holdsOf(ex.current); delete ex.current.hold; delete ex.current.holdW; }
    delete ex.weightSetAt;
  });
  st.v = 2;
  return st;
}

/* The rule: same weight, one more rep than last time. At the top of the rep range, add a step of weight and drop back to the bottom. */
function targetSets(ex){
  var repMin = ex.repMin || 8, repMax = ex.repMax || 12, step = (ex.step == null ? 2.5 : ex.step);
  if (!hasCurrent(ex)) {
    var out = [], w0 = setWeight(ex);
    for (var i = 0; i < (ex.sets || 3); i++) out.push({ w: w0, r: repMin, bump: null });
    return out;
  }
  var sets = ex.current.sets, lastIdx = sets.length - 1;
  var bumpWeight = (Number(sets[lastIdx].r) || 0) >= repMax;
  return sets.map(function(s, i){
    var w = Number(s.w) || 0, r = Number(s.r) || 0, isLast = i === lastIdx;
    if (bumpWeight) return { w: round2(w + step), r: isLast ? repMin : r, bump: null };
    if (isLast) return { w: w, r: r + 1, bump: 'r' };
    return { w: w, r: r, bump: null };
  });
}

var saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    store.set(KEY, JSON.stringify(S)).then(function(ok){
      if (!ok && ui.saveOK) { ui.saveOK = false; render(); }
    });
  }, 200);
}

/* ---------- starter template: 4-day upper/lower ---------- */
function starter(){
  var d = [{ id: uid(), name: 'Upper 1' }, { id: uid(), name: 'Lower 1' }, { id: uid(), name: 'Upper 2' }, { id: uid(), name: 'Lower 2' }];
  var lb = S.units === 'lb';
  function mk(di, name, muscle, sets, repMin, repMax, step){
    return { id: uid(), name: name, muscle: muscle, dayId: di === ABS ? ABS : d[di].id, sets: sets, repMin: repMin, repMax: repMax, step: lb ? step * 2 : step, weight: null, current: null };
  }
  var ex = [
    mk(0, 'Bench press', 'Chest', 3, 6, 10, 2.5),
    mk(0, 'Barbell row', 'Back', 3, 6, 10, 2.5),
    mk(0, 'Overhead press', 'Shoulders', 3, 6, 10, 2.5),
    mk(0, 'Lat pulldown', 'Back', 3, 8, 12, 2.5),
    mk(0, 'Dumbbell curl', 'Biceps', 3, 8, 12, 1),
    mk(0, 'Triceps pushdown', 'Triceps', 3, 8, 12, 2.5),
    mk(ABS, 'Weighted crunch', 'Abs', 3, 8, 12, 2.5),
    mk(ABS, 'Ab wheel rollout', 'Abs', 3, 8, 15, 2.5),
    mk(1, 'Squat', 'Quads', 3, 5, 8, 2.5),
    mk(1, 'Romanian deadlift', 'Hamstrings', 3, 6, 10, 2.5),
    mk(1, 'Leg press', 'Quads', 3, 8, 12, 5),
    mk(1, 'Leg curl', 'Hamstrings', 3, 8, 12, 2.5),
    mk(1, 'Standing calf raise', 'Calves', 3, 10, 15, 2.5),
    mk(2, 'Incline dumbbell press', 'Chest', 3, 8, 12, 2.5),
    mk(2, 'Weighted pull-up', 'Back', 3, 6, 10, 2.5),
    mk(2, 'Chest-supported row', 'Back', 3, 8, 12, 2.5),
    mk(2, 'Lateral raise', 'Shoulders', 3, 10, 15, 1),
    mk(2, 'Incline curl', 'Biceps', 3, 8, 12, 1),
    mk(2, 'Overhead triceps extension', 'Triceps', 3, 8, 12, 2.5),
    mk(3, 'Deadlift', 'Hamstrings', 3, 4, 6, 5),
    mk(3, 'Hack squat', 'Quads', 3, 8, 12, 5),
    mk(3, 'Bulgarian split squat', 'Quads', 3, 8, 12, 2.5),
    mk(3, 'Cable row', 'Back', 3, 8, 12, 2.5),
    mk(3, 'Leg extension', 'Quads', 3, 10, 15, 2.5),
    mk(3, 'Seated calf raise', 'Calves', 3, 10, 15, 2.5)
  ];
  return { days: d, exercises: ex };
}
function loadStarter(){
  var t = starter();
  S.days = S.days.concat(t.days);
  S.exercises = S.exercises.concat(t.exercises);
  ui.day = t.days[0].id;
  save(); closeSheet(); render(); toast('Starter loaded');
}

/* ---------- rendering ---------- */
function render(){
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.toggle('on', tabs[i].getAttribute('data-tab') === ui.tab);
  var html = ui.saveOK ? '' : '<div class="banner">Storage isn\'t available here, so changes won\'t be kept after you close this. Use Settings to copy your data out.</div>';
  html += ui.tab === 'workout' ? renderWorkout() : renderExercises();
  $('#view').innerHTML = html;
}

function renderWorkout(){
  var html = '';
  if (!S.exercises.length) {
    return html + '<div class="empty"><h2>Nothing to lift yet</h2>' +
      '<p>Add your exercises and group them into training days. Each time you train, the card shows what you did last time with the target set one rep higher.</p>' +
      '<div class="stack"><button class="btn primary" data-act="add-ex">Add an exercise</button>' +
      '<button class="btn ghost" data-act="load-starter">Load the 4-day upper/lower starter</button></div></div>';
  }
  var days = S.days;
  var known = ui.day === 'all' || days.some(function(d){ return d.id === ui.day; });
  if (!known) ui.day = days.length ? days[0].id : 'all';
  if (days.length) {
    html += '<div class="chips">' + days.map(function(d){
      return '<button class="chip' + (ui.day === d.id ? ' on' : '') + '" data-act="day" data-id="' + d.id + '">' + esc(d.name) + '</button>';
    }).join('') + '<button class="chip' + (ui.day === 'all' ? ' on' : '') + '" data-act="day" data-id="all">All</button></div>';
  }
  var exs = S.exercises.filter(function(e){ return e.dayId !== ABS && (ui.day === 'all' || e.dayId === ui.day); });
  var abs = S.exercises.filter(function(e){ return e.dayId === ABS; });
  if (!exs.length) {
    html += '<div class="empty" style="padding-bottom:8px"><h2>No exercises on this day</h2><p>Add one here, or move exercises onto it from the Exercises tab.</p>' +
      '<button class="btn primary wide" data-act="add-ex" data-day="' + ui.day + '">Add an exercise</button></div>';
  } else {
    html += exs.map(renderCard).join('');
    html += '<button class="btn ghost wide" data-act="add-ex" data-day="' + (ui.day === 'all' ? '' : ui.day) + '">Add an exercise' + (ui.day === 'all' ? '' : ' to ' + esc(dayName(ui.day))) + '</button>';
  }
  html += '<div class="grp abs-grp">Abs</div>';
  html += abs.map(renderCard).join('');
  html += '<button class="btn ghost wide" data-act="add-ex" data-day="' + ABS + '">Add an ab exercise</button>';
  if (exs.length && exs.concat(abs).every(isDone)) html += '<div class="alldone">All done for today</div>';
  return html;
}

function isDone(ex){ return ex.updatedAt === today(); }
/* True when the last set reached the top of the rep range last time, so this session's weight is higher. */
function weightGoesUp(ex){
  if (!hasCurrent(ex)) return false;
  var sets = ex.current.sets;
  return (Number(sets[sets.length - 1].r) || 0) >= (ex.repMax || 12);
}

function renderCard(ex){
  if (isDone(ex) && !ui.expanded[ex.id]) {
    return '<button class="card collapsed" data-act="expand" data-ex="' + ex.id + '" aria-label="' + esc(ex.name) + ', done, tap to open"><h3>' + esc(ex.name) + '</h3><span class="muscle">' + esc(ex.muscle || '') + '</span></button>';
  }
  if (!drafts[ex.id]) {
    var prevHolds = hasCurrent(ex) ? holdsOf(ex.current) : [];
    drafts[ex.id] = {
      sets: targetSets(ex),
      holds: prevHolds.length
        ? prevHolds.map(function(h){ return { w: h.w == null ? currentWeight(ex) : h.w, s: clampHold(h.s) }; })
        : [{ w: hasCurrent(ex) ? currentWeight(ex) : setWeight(ex), s: HOLD_MIN }]
    };
  }
  var d = drafts[ex.id], unit = S.units;
  var out = '<div class="card-head"><h3>' + esc(ex.name) + '</h3><span class="muscle">' + esc(ex.muscle || '') + '</span>' +
    (isDone(ex) ? '<button class="collapse-btn" data-act="collapse" data-ex="' + ex.id + '" aria-label="Collapse"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>' : '') + '</div>';
  var w0 = setWeight(ex);
  var lastLine = hasCurrent(ex) ? 'Last time <b>' + currentText(ex.current) + '</b>'
    : (w0 == null ? 'First session. Put in a starting weight and go.' : (w0 > 0 ? 'Starting at <b>' + fmtW(w0) + ' ' + unit + '</b>' : 'Starting with bodyweight'));
  if (weightGoesUp(ex)) lastLine += '<br>Top of your rep range reached, so the weight goes up to <b>' + fmtW(round2(currentWeight(ex) + (ex.step == null ? 2.5 : ex.step))) + ' ' + unit + '</b>';
  out += '<div class="last">' + lastLine + '</div>';
  out += '<div class="sethead"><span></span><span>' + unit + '</span><span>reps</span></div>';
  out += d.sets.map(function(s, i){
    var bumpW = '';
    var bumpR = s.bump === 'r' ? '<span class="bump">+1</span>' : '';
    return '<div class="set" data-i="' + i + '"><span class="n">' + (i + 1) + '</span>' +
      '<div class="stepper">' + bumpW + '<button data-act="w" data-n="-1" aria-label="Less weight">−</button>' +
      '<input type="number" inputmode="decimal" step="any" placeholder="' + unit + '" value="' + (s.w == null ? '' : s.w) + '" data-f="w" aria-label="Weight, set ' + (i + 1) + '">' +
      '<button data-act="w" data-n="1" aria-label="More weight">+</button></div>' +
      '<div class="stepper">' + bumpR + '<button data-act="r" data-n="-1" aria-label="Fewer reps">−</button>' +
      '<input type="number" inputmode="numeric" placeholder="reps" value="' + (s.r == null ? '' : s.r) + '" data-f="r" aria-label="Reps, set ' + (i + 1) + '">' +
      '<button data-act="r" data-n="1" aria-label="More reps">+</button></div></div>';
  }).join('');
  out += '<div class="actions" style="margin-top:2px;gap:4px"><button class="btn text" data-act="setn" data-n="1">Add set</button><button class="btn text" data-act="setn" data-n="-1"' + (d.sets.length <= 1 ? ' disabled' : '') + '>Remove set</button></div>';
  out += '<div class="hold"><div class="hl">Isometric hold' + (d.holds.length > 1 ? 's' : '') + '<span class="hs">after your last set, own weight, ' + HOLD_MIN + ' to ' + HOLD_MAX + ' seconds</span></div>' +
    '<div class="sethead"><span></span><span>' + unit + '</span><span>seconds</span></div>';
  out += d.holds.map(function(h, i){
    var hv = clampHold(h.s);
    return '<div class="holdrow" data-i="' + i + '"><span class="n">' + (i + 1) + '</span>' +
      '<div class="stepper"><button data-act="hw" data-n="-1" aria-label="Less hold weight">−</button>' +
      '<input type="number" inputmode="decimal" step="any" placeholder="' + unit + '" value="' + (h.w == null ? '' : h.w) + '" data-f="hw" aria-label="Hold ' + (i + 1) + ' weight">' +
      '<button data-act="hw" data-n="1" aria-label="More hold weight">+</button></div>' +
      '<div class="stepper"><button data-act="h" data-n="-1" aria-label="One second less"' + (hv <= HOLD_MIN ? ' disabled' : '') + '>−</button>' +
      '<input type="number" inputmode="numeric" min="' + HOLD_MIN + '" max="' + HOLD_MAX + '" value="' + hv + '" data-f="h" aria-label="Hold ' + (i + 1) + ' seconds">' +
      '<button data-act="h" data-n="1" aria-label="One second more"' + (hv >= HOLD_MAX ? ' disabled' : '') + '>+</button></div></div>';
  }).join('');
  out += '<div class="actions" style="margin-top:2px;gap:4px"><button class="btn text" data-act="holdn" data-n="1">Add hold</button><button class="btn text" data-act="holdn" data-n="-1"' + (d.holds.length <= 1 ? ' disabled' : '') + '>Remove hold</button></div></div>';
  out += '<div class="actions"><button class="btn primary" data-act="update">Update</button>' +
    (ex.undo && ex.updatedAt === today() ? '<button class="btn ghost" data-act="undo">Undo</button>' : '') + '</div>';
  return '<article class="card" data-ex="' + ex.id + '">' + out + '</article>';
}

function renderExercises(){
  var html = '<div class="section" style="margin-top:6px"><h2>Training days</h2><button class="btn text" data-act="add-day">Add day</button></div>';
  if (S.days.length) {
    html += '<div class="chips" style="margin-bottom:4px">' + S.days.map(function(d){
      return '<button class="chip" data-act="edit-day" data-id="' + d.id + '">' + esc(d.name) + '</button>';
    }).join('') + '</div>';
  } else {
    html += '<p class="hint">No days yet. Add Push, Pull, Legs, Upper, Lower, or whatever you run, then put exercises on them.</p>';
  }
  html += '<div class="section"><h2>Exercises</h2><button class="btn text" data-act="add-ex">Add exercise</button></div>';
  if (!S.exercises.length) {
    return html + '<div class="empty" style="padding-top:4px"><p>No exercises yet.</p><button class="btn ghost wide" data-act="load-starter">Load the 4-day upper/lower starter</button></div>';
  }
  var groups = S.days.map(function(d){ return { id: d.id, name: d.name }; }).concat([{ id: ABS, name: 'Abs, end of every day' }, { id: '', name: 'No day' }]);
  groups.forEach(function(g){
    var exs = S.exercises.filter(function(e){ return (e.dayId || '') === g.id; });
    if (!exs.length) return;
    html += '<div class="grp">' + esc(g.name) + '</div>';
    html += exs.map(function(e){
      var cw = currentWeight(e);
      return '<button class="exrow" data-act="edit-ex" data-id="' + e.id + '"><div><div class="nm">' + esc(e.name) + '</div><div class="sub">' +
        esc(e.muscle || '') + (e.muscle ? ', ' : '') + (cw != null ? fmtW(cw) + (cw > 0 ? ' ' + S.units : '') + ', ' : '') + e.sets + ' sets, ' + e.repMin + ' to ' + e.repMax + ' reps</div></div><span class="chev">›</span></button>';
    }).join('');
  });
  return html;
}

/* ---------- sheets ---------- */
function renderSheet(inner){
  $('#sheet-root').innerHTML = '<div class="backdrop" data-act="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>' + inner + '</div>';
  document.body.style.overflow = 'hidden';
}
function closeSheet(){ $('#sheet-root').innerHTML = ''; document.body.style.overflow = ''; }
function sheetOpen(){ return !!$('#sheet-root .sheet'); }

function miniStepper(f, val, lo, hi){
  return '<div class="stepper" data-lo="' + lo + '" data-hi="' + hi + '"><button data-act="sheet-step" data-n="-1" aria-label="Less">−</button>' +
    '<input type="number" inputmode="numeric" id="f-' + f + '" value="' + val + '"><button data-act="sheet-step" data-n="1" aria-label="More">+</button></div>';
}

var sheetCtx = null;

function openExerciseSheet(id, dayId){
  var ex = id ? exById(id) : { name: '', muscle: dayId === ABS ? 'Abs' : 'Chest', dayId: dayId || (S.days[0] ? S.days[0].id : ''), sets: 3, repMin: 8, repMax: 12, weight: null };
  if (!ex) return;
  var curW = id ? currentWeight(ex) : null;
  sheetCtx = { kind: 'ex', id: id || null, shownWeight: curW };
  renderSheet(
    '<h2>' + (id ? 'Edit exercise' : 'New exercise') + '</h2>' +
    '<div class="field"><label for="f-name">Name</label><input id="f-name" type="text" value="' + esc(ex.name) + '" placeholder="e.g. Incline dumbbell press" autocomplete="off" autocapitalize="sentences"></div>' +
    '<div class="row2">' +
      '<div class="field"><label for="f-muscle">Muscle group</label><div class="selwrap"><select id="f-muscle">' + MUSCLES.map(function(m){ return '<option' + (m === ex.muscle ? ' selected' : '') + '>' + m + '</option>'; }).join('') + '</select></div></div>' +
      '<div class="field"><label for="f-day">Training day</label><div class="selwrap"><select id="f-day"><option value="">No day</option>' + S.days.map(function(d){ return '<option value="' + d.id + '"' + (d.id === ex.dayId ? ' selected' : '') + '>' + esc(d.name) + '</option>'; }).join('') + '<option value="' + ABS + '"' + (ex.dayId === ABS ? ' selected' : '') + '>Abs (end of every day)</option></select></div></div>' +
    '</div>' +
    '<div class="row2">' +
      '<div class="field"><label for="f-weight">Working weight (' + S.units + ')</label><input id="f-weight" type="number" inputmode="decimal" step="any" value="' + (curW == null ? '' : curW) + '" placeholder="e.g. 80"></div>' +
      '<div class="field"><label for="f-sets">Sets</label>' + miniStepper('sets', ex.sets || 3, 1, 10) + '</div>' +
    '</div>' +
    '<div class="row2">' +
      '<div class="field"><label for="f-repMin">Reps from</label>' + miniStepper('repMin', ex.repMin || 8, 1, 50) + '</div>' +
      '<div class="field"><label for="f-repMax">Reps up to</label>' + miniStepper('repMax', ex.repMax || 12, 1, 50) + '</div>' +
    '</div>' +
    '<p class="hint">Each session the last set is set one rep higher than last time; the other sets stay as they were. When the last set reaches the top of the range, the weight goes up on every set and the last set drops back to the bottom. Change the working weight here and the exercise starts fresh from it.</p>' +
    '<div class="actions"><button class="btn primary" data-act="save-ex">' + (id ? 'Save changes' : 'Add exercise') + '</button><button class="btn ghost" data-act="close-sheet">Cancel</button></div>' +
    (id ? '<div class="actions" style="justify-content:space-between"><div><button class="btn text" data-act="move-ex" data-n="-1">Move up</button><button class="btn text" data-act="move-ex" data-n="1">Move down</button></div><button class="btn text danger" data-act="del-ex">Delete</button></div>' : '')
  );
  if (!id) { var n = $('#f-name'); if (n) n.focus(); }
}

function openDaySheet(id){
  var day = id ? S.days.filter(function(d){ return d.id === id; })[0] : { name: '' };
  if (!day) return;
  sheetCtx = { kind: 'day', id: id || null };
  renderSheet(
    '<h2>' + (id ? 'Edit day' : 'New training day') + '</h2>' +
    '<div class="field"><label for="f-dayname">Name</label><input id="f-dayname" type="text" value="' + esc(day.name) + '" placeholder="e.g. Push" autocomplete="off" autocapitalize="sentences"></div>' +
    '<div class="actions"><button class="btn primary" data-act="save-day">' + (id ? 'Save changes' : 'Add day') + '</button><button class="btn ghost" data-act="close-sheet">Cancel</button></div>' +
    (id ? '<div class="actions"><button class="btn text danger" data-act="del-day">Delete day</button></div><p class="hint">Exercises on this day are kept and moved to "No day".</p>' : '')
  );
  var n = $('#f-dayname'); if (n && !id) n.focus();
}

function openSettings(){
  sheetCtx = { kind: 'settings' };
  renderSheet(
    '<h2>Settings</h2>' +
    '<div class="field"><label>Units</label><div class="seg"><button data-act="units" data-u="kg" class="' + (S.units === 'kg' ? 'on' : '') + '">kg</button><button data-act="units" data-u="lb" class="' + (S.units === 'lb' ? 'on' : '') + '">lb</button></div></div>' +
    '<div class="field"><label>Your data</label><div class="actions" style="margin-top:0"><button class="btn ghost" style="flex:1" data-act="export">Copy data</button><button class="btn ghost" style="flex:1" data-act="import-open">Import data</button></div>' +
    '<div id="export-box" hidden style="margin-top:10px"><textarea id="f-export" readonly aria-label="Your data"></textarea><p class="hint" style="margin-top:6px">Select all and copy this text to move your numbers somewhere else.</p></div>' +
    '<div id="import-box" hidden style="margin-top:10px"><textarea id="f-import" placeholder="Paste your copied data here" aria-label="Data to import"></textarea><div class="actions"><button class="btn primary" data-act="import">Import and replace</button></div></div></div>' +
    '<div class="field"><label>Starter programme</label><button class="btn ghost wide" data-act="load-starter">Add the 4-day upper/lower starter</button></div>' +
    '<div class="field"><button class="btn text danger" data-act="reset">Delete all data</button></div>' +
    '<p class="hint">Everything is stored on this device only.</p>'
  );
}

/* Two-tap confirmation, so nothing destructive happens on a single accidental press. */
function armed(el, label){
  if (el.getAttribute('data-armed') === '1') return true;
  el.setAttribute('data-armed', '1');
  var orig = el.textContent;
  el.textContent = label;
  setTimeout(function(){ if (el.isConnected) { el.textContent = orig; el.removeAttribute('data-armed'); } }, 3000);
  return false;
}

/* After an update, bring the next exercise still to do into view. */
function scrollToNext(exId){
  var cards = Array.prototype.slice.call(document.querySelectorAll('#view .card'));
  var from = -1;
  for (var i = 0; i < cards.length; i++) if (cards[i].getAttribute('data-ex') === exId) { from = i; break; }
  var next = null;
  for (var j = from + 1; j < cards.length; j++) if (!cards[j].classList.contains('collapsed')) { next = cards[j]; break; }
  if (!next) for (var k = 0; k < cards.length; k++) if (!cards[k].classList.contains('collapsed')) { next = cards[k]; break; }
  if (!next) next = $('#view .alldone');
  if (next && next.scrollIntoView) {
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    try { next.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); } catch (e) { next.scrollIntoView(); }
  }
}

var toastT = null;
function toast(msg){
  var t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('show'); }, 1500);
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el || el.disabled) return;
  var act = el.getAttribute('data-act');
  var card = el.closest('.card');
  var d, s, row, ex, n, i, id;

  switch (act) {
    case 'tab': ui.tab = el.getAttribute('data-tab'); render(); window.scrollTo(0, 0); break;
    case 'day': ui.day = el.getAttribute('data-id'); render(); break;
    case 'expand': ui.expanded[el.getAttribute('data-ex')] = true; render(); break;
    case 'collapse': delete ui.expanded[el.getAttribute('data-ex')]; render(); break;

    case 'w': case 'r':
      row = el.closest('.set'); ex = exById(card.getAttribute('data-ex')); d = drafts[ex.id]; i = Number(row.getAttribute('data-i')); s = d.sets[i]; n = Number(el.getAttribute('data-n'));
      if (act === 'w') { var step = (ex.step != null) ? Number(ex.step) : 2.5; s.w = Math.max(0, round2((Number(s.w) || 0) + n * step)); }
      else { s.r = Math.max(0, (Number(s.r) || 0) + n); }
      s.bump = null;
      var inp = row.querySelector('input[data-f="' + act + '"]'); inp.value = act === 'w' ? s.w : s.r;
      var chip = el.parentElement.querySelector('.bump'); if (chip) chip.remove();
      break;

    case 'hw':
      ex = exById(card.getAttribute('data-ex')); d = drafts[ex.id]; n = Number(el.getAttribute('data-n'));
      row = el.closest('.holdrow'); var hrow = d.holds[Number(row.getAttribute('data-i'))];
      var hstep = (ex.step != null) ? Number(ex.step) : 2.5;
      hrow.w = Math.max(0, round2((Number(hrow.w) || 0) + n * hstep));
      el.parentElement.querySelector('input[data-f="hw"]').value = hrow.w;
      break;

    case 'h':
      d = drafts[card.getAttribute('data-ex')]; n = Number(el.getAttribute('data-n'));
      row = el.closest('.holdrow'); var hrow2 = d.holds[Number(row.getAttribute('data-i'))];
      hrow2.s = clampHold(clampHold(hrow2.s) + n);
      var hst = el.parentElement;
      hst.querySelector('input[data-f="h"]').value = hrow2.s;
      hst.querySelector('[data-n="-1"]').disabled = hrow2.s <= HOLD_MIN;
      hst.querySelector('[data-n="1"]').disabled = hrow2.s >= HOLD_MAX;
      break;

    case 'holdn':
      d = drafts[card.getAttribute('data-ex')]; n = Number(el.getAttribute('data-n'));
      if (n > 0) { var lastH = d.holds[d.holds.length - 1]; d.holds.push({ w: lastH ? lastH.w : null, s: lastH ? clampHold(lastH.s) : HOLD_MIN }); }
      else if (d.holds.length > 1) d.holds.pop();
      render(); break;

    case 'setn':
      d = drafts[card.getAttribute('data-ex')]; n = Number(el.getAttribute('data-n'));
      if (n > 0) { var last = d.sets[d.sets.length - 1]; d.sets.push({ w: last ? last.w : null, r: last ? last.r : 8, bump: null }); }
      else if (d.sets.length > 1) d.sets.pop();
      render(); break;

    case 'update':
      ex = exById(card.getAttribute('data-ex')); d = drafts[ex.id];
      var sets = d.sets.map(function(x){ return { w: (x.w == null || x.w === '') ? 0 : Number(x.w), r: Number(x.r) || 0 }; });
      if (sets.every(function(x){ return x.r === 0; })) { toast('Enter your reps first'); return; }
      ex.undo = { current: hasCurrent(ex) ? copy(ex.current) : null };
      ex.current = { sets: sets, holds: d.holds.map(function(h){ return { w: (h.w == null || h.w === '') ? 0 : Math.max(0, Number(h.w) || 0), s: clampHold(h.s) }; }) };
      ex.sets = sets.length;
      ex.updatedAt = today();
      delete drafts[ex.id]; delete ui.expanded[ex.id]; save(); render(); toast('Updated'); scrollToNext(ex.id); break;

    case 'undo':
      ex = exById(card.getAttribute('data-ex')); if (!ex.undo) return;
      ex.current = ex.undo.current; delete ex.undo; delete ex.updatedAt;
      if (hasCurrent(ex)) ex.sets = ex.current.sets.length;
      delete drafts[ex.id]; delete ui.expanded[ex.id]; save(); render(); toast('Undone'); break;

    case 'add-ex': openExerciseSheet(null, el.getAttribute('data-day') || ''); break;
    case 'edit-ex': openExerciseSheet(el.getAttribute('data-id')); break;
    case 'add-day': openDaySheet(null); break;
    case 'edit-day': openDaySheet(el.getAttribute('data-id')); break;
    case 'settings': openSettings(); break;
    case 'close-sheet': closeSheet(); break;

    case 'load-starter':
      if (S.exercises.length && !armed(el, 'Tap again to add the starter')) return;
      loadStarter(); break;

    case 'sheet-step':
      var st = el.parentElement, inp2 = st.querySelector('input');
      inp2.value = clamp((Number(inp2.value) || 0) + Number(el.getAttribute('data-n')), Number(st.getAttribute('data-lo')), Number(st.getAttribute('data-hi')));
      break;

    case 'save-ex':
      var name = $('#f-name').value.trim();
      if (!name) { toast('Give it a name'); $('#f-name').focus(); return; }
      var repMin = clamp(Number($('#f-repMin').value) || 8, 1, 50), repMax = clamp(Number($('#f-repMax').value) || 12, 1, 50);
      if (repMax < repMin) repMax = repMin;
      var wv = $('#f-weight').value.trim(), newW = wv === '' ? null : Math.max(0, Number(wv) || 0);
      var data = { name: name, muscle: $('#f-muscle').value, dayId: $('#f-day').value, sets: clamp(Number($('#f-sets').value) || 3, 1, 10), repMin: repMin, repMax: repMax };
      if (sheetCtx && sheetCtx.id) {
        ex = exById(sheetCtx.id);
        if (ex) {
          for (var key in data) ex[key] = data[key];
          if (newW !== sheetCtx.shownWeight) { ex.weight = newW; ex.current = null; delete ex.undo; }
          if (hasCurrent(ex)) {
            while (ex.current.sets.length < ex.sets) ex.current.sets.push(copy(ex.current.sets[ex.current.sets.length - 1]));
            ex.current.sets.length = ex.sets;
          }
        }
        toast('Saved');
      } else {
        data.id = uid(); data.step = S.units === 'kg' ? 2.5 : 5; data.weight = newW; data.current = null;
        S.exercises.push(data);
        if (ui.tab === 'workout' && data.dayId && ui.day !== 'all') ui.day = data.dayId;
        toast('Added');
      }
      drafts = {}; save(); closeSheet(); render(); break;

    case 'del-ex':
      if (!armed(el, 'Tap again to delete it')) return;
      id = sheetCtx.id;
      S.exercises = S.exercises.filter(function(x){ return x.id !== id; });
      drafts = {}; save(); closeSheet(); render(); toast('Deleted'); break;

    case 'move-ex':
      ex = exById(sheetCtx.id); if (!ex) return;
      var sib = S.exercises.filter(function(x){ return (x.dayId || '') === (ex.dayId || ''); });
      var pos = sib.indexOf(ex), to = pos + Number(el.getAttribute('data-n'));
      if (to < 0 || to >= sib.length) return;
      var a = S.exercises.indexOf(sib[pos]), b = S.exercises.indexOf(sib[to]);
      S.exercises[a] = sib[to]; S.exercises[b] = sib[pos];
      save(); render(); toast(Number(el.getAttribute('data-n')) < 0 ? 'Moved up' : 'Moved down'); break;

    case 'save-day':
      var dn = $('#f-dayname').value.trim();
      if (!dn) { toast('Give it a name'); $('#f-dayname').focus(); return; }
      if (sheetCtx && sheetCtx.id) { S.days.forEach(function(x){ if (x.id === sheetCtx.id) x.name = dn; }); toast('Saved'); }
      else { var nd = { id: uid(), name: dn }; S.days.push(nd); if (ui.day === 'all' && S.days.length === 1) ui.day = nd.id; toast('Added'); }
      save(); closeSheet(); render(); break;

    case 'del-day':
      if (!armed(el, 'Tap again to delete this day')) return;
      id = sheetCtx.id;
      S.days = S.days.filter(function(x){ return x.id !== id; });
      S.exercises.forEach(function(x){ if (x.dayId === id) x.dayId = ''; });
      if (ui.day === id) ui.day = S.days.length ? S.days[0].id : 'all';
      save(); closeSheet(); render(); toast('Day deleted'); break;

    case 'units': S.units = el.getAttribute('data-u'); save(); render(); openSettings(); break;

    case 'export':
      var json = JSON.stringify(S);
      var box = $('#export-box'), ta = $('#f-export');
      ta.value = json; box.hidden = false; $('#import-box').hidden = true;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(json).then(function(){ toast('Copied'); }, function(){ ta.focus(); ta.select(); });
      } else { ta.focus(); ta.select(); }
      break;
    case 'import-open': $('#import-box').hidden = false; $('#export-box').hidden = true; $('#f-import').focus(); break;
    case 'import':
      var parsed = null;
      try { parsed = JSON.parse($('#f-import').value); } catch (err) { parsed = null; }
      if (!parsed || !Array.isArray(parsed.exercises)) { toast('That data isn\'t in the right format'); return; }
      S = migrate(parsed);
      drafts = {}; ui.day = S.days[0] ? S.days[0].id : 'all';
      save(); closeSheet(); render(); toast('Imported'); break;

    case 'reset':
      if (!armed(el, 'Tap again to delete everything')) return;
      S = defaultState(); drafts = {}; ui.day = 'all';
      save(); closeSheet(); render(); toast('Cleared'); break;
  }
});

document.addEventListener('input', function(e){
  var inp = e.target;
  if (!inp.matches || !inp.matches('.card input[data-f]')) return;
  var card = inp.closest('.card');
  var d = drafts[card.getAttribute('data-ex')]; if (!d) return;
  if (inp.getAttribute('data-f') === 'h' || inp.getAttribute('data-f') === 'hw') {
    var hr = d.holds[Number(inp.closest('.holdrow').getAttribute('data-i'))];
    if (inp.getAttribute('data-f') === 'h') hr.s = inp.value === '' ? HOLD_MIN : Number(inp.value);
    else hr.w = inp.value === '' ? null : Number(inp.value);
    return;
  }
  var row = inp.closest('.set');
  var s = d.sets[Number(row.getAttribute('data-i'))];
  if (inp.getAttribute('data-f') === 'w') s.w = inp.value === '' ? null : Number(inp.value);
  else s.r = inp.value === '' ? 0 : Number(inp.value);
  s.bump = null;
  var chip = inp.parentElement.querySelector('.bump'); if (chip) chip.remove();
});

document.addEventListener('change', function(e){
  var inp = e.target;
  if (!inp.matches || !inp.matches('.card input[data-f="h"]')) return;
  var d = drafts[inp.closest('.card').getAttribute('data-ex')]; if (!d) return;
  var hr = d.holds[Number(inp.closest('.holdrow').getAttribute('data-i'))]; if (!hr) return;
  hr.s = clampHold(hr.s); inp.value = hr.s;
  var hst = inp.parentElement;
  hst.querySelector('[data-n="-1"]').disabled = hr.s <= HOLD_MIN;
  hst.querySelector('[data-n="1"]').disabled = hr.s >= HOLD_MAX;
});

document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && sheetOpen()) closeSheet();
});

/* ---------- boot ---------- */
function init(){
  var waited = 0;
  (function waitForStorage(){
    if (store.hasClaude() || waited >= 300) { load(); return; }
    waited += 50; setTimeout(waitForStorage, 50);
  })();
}
function load(){
  var timeout = new Promise(function(res){ setTimeout(function(){ res(null); }, 4000); });
  Promise.race([store.get(KEY), timeout]).then(function(raw){
    if (raw) { try { S = JSON.parse(raw); } catch (e) { S = null; } }
    if (!S || typeof S !== 'object') S = defaultState();
    var needsSave = S.v !== 2;
    S = migrate(S);
    if (needsSave) save();
    ui.day = S.days[0] ? S.days[0].id : 'all';
    render();
  });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
